[package]
name = "bars-ipc"
version = "0.1.0"
authors = ["Patrick Winters <19wintersp@gmail.com>"]
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
bars-config = { workspace = true, features = ["serde"] }
bars-graph = { workspace = true, features = ["serde"] }

futures = { workspace = true, optional = true }
postcard = { workspace = true, optional = true, features = ["use-std"] }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, optional = true, features = ["io-util", "net"] }
tokio-util = { workspace = true, optional = true, features = ["codec"] }

[features]
codec = ["dep:postcard", "dep:tokio", "dep:tokio-util"]
tcp = ["codec", "dep:futures"]
